<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays Demo</title>
</head>
<body>
    <strong>
        <script type="text/javascript">
            a=new Array(5);
            for(i=0;i<5;i++){
                a[i]=i;
                document.write(a[i]+"<br>")
            }
            document.write("Another way of initialization"+"<br>")
            b=new Array(11,22,33,44,55);
            for(i=0;i<5;i++){
                document.write(b[i]+"<br>")
            }
            document.write("Let another way of initialization"+"<br>")
            c=new Array(100,200,300,400,500);
            for(i=0;i<5;i++){
                document.write(c[i]+"<br>")
            }
        </script>
    </strong>
</body>
</html>
