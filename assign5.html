    <title>Validation </title>
    <script>
        function validate(){
            value=document.getElementById('s1').value;
            if(isNan(value)){
                document.getElementById('s').innerHTML="Enter the numeric value only";
                retun false
            }
        return true
        }
    </script>
</head>
<body>
