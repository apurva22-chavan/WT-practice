<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stars</title>
</head>
<body>
    <h1>Stars</h1>

    <h3>Stars:</h3>
    <script type="text/javascript">
        var Stars = 5;  
        document.write("Starssss:<br>");
        for (var i = 1; i <= Stars; i++) {
            for (var j = 1; j <= i; j++) {
                document.write("*");
            }
            document.write("<br>");
        }
    </script>
</body>
</html>
