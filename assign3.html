<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foreground</title>
    
</head>

<body>
    
    <script>
        function changeColor(color){
            const poem = document.getElementById('color')
            poem.style.color = color
        }
    </script>

    <div id="color">
        <h1>Twinkle, Twinkle, Little Star</h1>
        <p>
            Twinkle, twinkle, little star,<br>
            How I wonder what you are!<br>
            Up above the world so high,<br>
            Like a diamond in the sky.<br><br>

        </p>
    </div>
    <div>
        <button onclick="changeColor('pink')">Pink</button>
        <button onclick="changeColor('gray')">Gray</button>
        <button onclick="changeColor('green')">Green</button>
        <button onclick="changeColor('blue')">Blue</button>
        <button onclick="changeColor('red')">Red</button>
    </div>

</body>

</html>
