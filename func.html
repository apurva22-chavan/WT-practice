<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Demo</title>
<script type="text/javascript">
function my_fun(){
    document.write("This text is written within function!!")
}
</script>
</head>
<body>
    <script type="text/javascript">
        document.write("This text is written above function call <br>")
        my_fun();
    </script>
</body>
</html>
