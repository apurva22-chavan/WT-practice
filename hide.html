<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hide on Double Click</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script> 
    <script>
        $(document).ready(function() {
            $("p").dblclick(function() {  
                $(this).hide();  
            });
        });
    </script>
</head>
<body>
    <h1>Click me to Hide </h1>
    <p>Click me to away!!</p>
    <p>Click me too!!</p>
</body>
</html>
