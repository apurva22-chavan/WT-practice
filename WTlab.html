<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: Verdana, sans-serif;
      background-image: url("https://wallpaperaccess.com/full/623110.png");
      background-size: cover;
      background-position: center;
    }

    .container {
      max-width: 400px;
      margin-top: 80px;
      background: rgba(255, 255, 255, 0.6); 
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(5px); 
    }

    .error {
      color: red;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <script>
    function validateForm() {
      let password = document.getElementById("password").value;
      let repassword = document.getElementById("repassword").value;
      let contact = document.getElementById("contact").value;
      let contactError = document.getElementById("contactError");
      let passwordError = document.getElementById("passwordError");

      contactError.textContent = "";
      passwordError.textContent = "";

      if (!/^\d{10}$/.test(contact)) {
        contactError.textContent = "Contact number must be exactly 10 digits.";
        return false;
      }

      if (password !== repassword) {
        passwordError.textContent = "Passwords do not match!";
        return false;
      }

      return true;
    }
  </script>

  <div class="container">
    <h2 class="text-center">REGISTRATION FORM</h2>
    <form action="https://www.google.com/" onsubmit="return validateForm()">
      
        <label>User ID:</label>
        <input type="text" class="form-control" id="userid" placeholder="User ID" required>

        <label>Password:</label>
        <input type="password" class="form-control" id="password" placeholder="Password" required>

        <label>Re-enter Password:</label>
        <input type="password" class="form-control" id="repassword" placeholder="Re-enter Password" required>
        <span class="error" id="passwordError"></span>

        <label>Contact No:</label>
        <input type="text" class="form-control" id="contact" placeholder="Contact No" required>
        <span class="error" id="contactError"></span>

        <label>Email ID:</label>
        <input type="email" class="form-control" id="email" placeholder="Email" required>

        <div class="text-center mt-3">
          <button type="submit" class="btn btn-primary">Submit</button>
          <button type="reset" class="btn btn-secondary">Reset</button>
        </div>

    </form>
  </div>

</body>

</html>
